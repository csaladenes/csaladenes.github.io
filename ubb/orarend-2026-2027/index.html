<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UBB Órarend 2026–2027 — Csala Dénes</title>
<style>
  :root{
    --bg:#0f1220; --card:#171b2e; --card2:#1e2338; --txt:#e8eaf2; --mut:#9aa0bd;
    --bi:#6aa9ff; --mi:#7bd88f; --iir:#c792ea; --adv:#ffcb6b; --wrk:#ff7a90; --ip:#5ad1ff;
    --line:#2a3050;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
  header{padding:34px 20px 18px;text-align:center;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:1.5rem;font-weight:600;letter-spacing:.3px}
  header p{color:var(--mut);margin:6px 0 0;font-size:.92rem}
  .wrap{max-width:880px;margin:0 auto;padding:22px 16px 60px}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
  .actions a{background:var(--card2);color:var(--txt);text-decoration:none;padding:10px 16px;border-radius:10px;border:1px solid var(--line);font-size:.9rem;font-weight:500}
  .actions a:hover{border-color:var(--ip)}
  .legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0 26px;font-size:.8rem;color:var(--mut)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .month{margin:22px 0 8px;color:var(--mut);font-size:.82rem;letter-spacing:1px;text-transform:uppercase;font-weight:600}
  .ev{display:flex;gap:14px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;transition:border-color .15s}
  .ev:hover{border-color:var(--c)}
  .bar{width:4px;border-radius:4px;background:var(--c);flex:0 0 4px}
  .date{flex:0 0 96px;font-variant-numeric:tabular-nums}
  .date .d{font-size:1.15rem;font-weight:600}
  .date .wd{color:var(--mut);font-size:.78rem}
  .body{flex:1}
  .body .t{font-weight:600;font-size:1rem}
  .body .desc{color:var(--mut);font-size:.85rem;margin-top:3px}
  .body .meta{font-size:.74rem;color:var(--c);margin-top:6px;font-weight:600;letter-spacing:.4px}
  .allday{align-items:center;background:linear-gradient(90deg,rgba(255,122,144,.12),transparent)}
  footer{text-align:center;color:var(--mut);font-size:.78rem;padding:24px 0 10px;border-top:1px solid var(--line);margin-top:30px}
  @media(max-width:560px){.date{flex:0 0 70px}}
</style>
</head>
<body>
<header>
  <h1>UBB Órarend · 2026–2027</h1>
  <p>Gazdasági informatika · Csala Dénes · BI (ősz) · IIR / MI / ADV (tavasz)</p>
  <div class="actions">
    <a href="orarend-2026-2027.ics" download>⬇ .ics letöltése</a>
    <a href="#" id="gcal" target="_blank" rel="noopener">↗ Google Naptár (webcal)</a>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--bi)"></i>BI</span>
    <span><i class="dot" style="background:var(--mi)"></i>MI</span>
    <span><i class="dot" style="background:var(--iir)"></i>IIR</span>
    <span><i class="dot" style="background:var(--adv)"></i>ADV</span>
    <span><i class="dot" style="background:var(--ip)"></i>Élő (in-person)</span>
    <span><i class="dot" style="background:var(--wrk)"></i>Workshop</span>
  </div>
</header>
<div class="wrap" id="list"></div>
<footer>Készült az egyetemi naptari adatok alapján · utolsó frissítés: 2026-07-15</footer>

<script>

];
const COL={bi:"var(--bi)",mi:"var(--mi)",iir:"var(--iir)",adv:"var(--adv)",wrk:"var(--wrk)"};
const WD=["Vasárnap","Hétfő","Kedd","Szerda","Csütörtök","Péntek","Szombat"];
const MON=["Január","Február","Március","Április","Május","Június","Július","Augusztus","Szeptember","Október","November","December"];
const list=document.getElementById("list");
let last="";
E.forEach(e=>{
  const dt=new Date(e.d+"T00:00:00");
  const m=MON[dt.getMonth()]+" "+dt.getFullYear();
  if(m!==last){const h=document.createElement("div");h.className="month";h.textContent=m;list.appendChild(h);last=m;}
  const day=dt.getDate(), wd=WD[dt.getDay()];
  const allday=e.m==="ALL-DAY";
  const el=document.createElement("div");
  el.className="ev"+(allday?" allday":"");
  el.style.setProperty("--c",COL[e.c]);
  el.innerHTML=`<div class="bar"></div>
    <div class="date"><div class="d">${day}</div><div class="wd">${wd}</div></div>
    <div class="body"><div class="t">${e.t}</div><div class="desc">${e.desc}</div><div class="meta">${e.m} · ${e.loc}</div></div>`;
  list.appendChild(el);
});
document.getElementById("gcal").href="https://calendar.google.com/calendar/render?cid="+encodeURIComponent("webcal://"+location.origin+location.pathname.replace(/index\.html.*/,"")+"orarend-2026-2027.ics");
</script>
